<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>إنشاء حساب - كرار كريم</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-card">

      <div class="auth-logo">
        📸
      </div>

      <h1>إنشاء حساب</h1>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">الاسم الكامل</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="أدخل اسمك الكامل"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="أعد كتابة كلمة المرور"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" class="auth-button">
          إنشاء الحساب
        </button>

        <p id="registerMessage" class="auth-message"></p>

      </form>

      <div class="auth-divider">
        <span>أو التسجيل باستخدام</span>
      </div>

      <div class="social-login">

        <button type="button" class="social-button google-button">
          <span class="social-icon google-icon">G</span>
          <span>التسجيل باستخدام Google</span>
        </button>

        <button type="button" class="social-button facebook-button">
          <span class="social-icon facebook-icon">f</span>
          <span>التسجيل باستخدام Facebook</span>
        </button>

        <button type="button" class="social-button phone-button">
          <span class="social-icon phone-icon">☎</span>
          <span>التسجيل باستخدام رقم الهاتف</span>
        </button>

      </div>

      <p class="auth-switch">
        لديك حساب بالفعل؟
        <a href="login.html">تسجيل الدخول</a>
      </p>

      <a href="index.html" class="back-home">
        العودة إلى الرئيسية
      </a>

    </div>

  </main>

  <script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('registerMessage');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        message.textContent = 'كلمتا المرور غير متطابقتين';
        message.className = 'auth-message error';
        return;
      }

      message.textContent =
        'واجهة التسجيل جاهزة للربط بقاعدة البيانات';

      message.className = 'auth-message success';
    });
  </script>

</body>
</html>

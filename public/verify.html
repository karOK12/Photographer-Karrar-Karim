<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>التحقق من البريد الإلكتروني</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#07111f;color:#f4f7fb;font-family:Cairo,Arial,sans-serif}
    .card{width:100%;max-width:430px;padding:28px;border:1px solid #24344b;border-radius:22px;background:#101c2d;box-shadow:0 18px 55px #0005}
    .mark{width:62px;height:62px;display:grid;place-items:center;margin:0 auto 18px;border-radius:18px;background:#163d70;color:#8dc4ff;font-size:30px}
    h1{text-align:center;font-size:23px;margin:0 0 10px}
    .desc{text-align:center;color:#aebdd0;font-size:14px;line-height:1.9;margin:0 0 22px}
    #email{color:#8dc4ff;overflow-wrap:anywhere}
    label{display:block;margin:0 0 8px;font-weight:700}
    input{width:100%;height:58px;border:1px solid #344860;border-radius:13px;background:#081321;color:white;text-align:center;font-size:27px;letter-spacing:9px;font-weight:800;outline:none}
    input:focus{border-color:#4094ff;box-shadow:0 0 0 3px #4094ff22}
    button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:16px;background:#2479e8;color:white;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #message{margin-top:15px;font-size:14px;line-height:1.8;text-align:center;white-space:pre-wrap}
    .error{color:#ff9c9c}.success{color:#8ce0b2}
    .hint{text-align:center;color:#8092a8;font-size:12px;margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✉</div>
    <h1>تحقق من بريدك الإلكتروني</h1>
    <p class="desc">أدخل رمز التحقق المكوّن من 6 أرقام الذي أرسلناه إلى:<br><strong id="email">...</strong></p>
    <form id="verifyForm">
      <label for="code">رمز التحقق</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required>
      <button id="submitBtn" type="submit">تحقق وأنشئ الحساب</button>
    </form>
    <div id="message" role="status"></div>
    <p class="hint">تنتهي صلاحية الرمز خلال 10 دقائق.</p>
  </main>
  <script>
    const email = new URLSearchParams(location.search).get('email') || '';
    const emailLabel = document.getElementById('email');
    const codeInput = document.getElementById('code');
    const button = document.getElementById('submitBtn');
    const message = document.getElementById('message');

    let pending = null;
    let formData = null;

    try {
      pending = JSON.parse(sessionStorage.getItem('pendingVerification') || 'null');
      formData = JSON.parse(sessionStorage.getItem('verifyFormData') || 'null');
    } catch (_) {}

    emailLabel.textContent = email;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type || '';
    }

    document.getElementById('verifyForm').addEventListener('submit', async event => {
      event.preventDefault();

      if (!pending || !formData || !email || pending.email !== email) {
        showMessage('بيانات التسجيل المؤقتة غير موجودة. ارجع إلى صفحة التسجيل وأعد المحاولة.', 'error');
        return;
      }

      const code = codeInput.value.trim();
      if (!/^\d{6}$/.test(code)) {
        showMessage('أدخل رمزاً صحيحاً مكوّناً من 6 أرقام.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'جارٍ التحقق وحفظ الحساب...';
      showMessage('', '');

      try {
        const verifyResponse = await fetch('/api/otp/verify', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, code})
        });
        const verifyData = await verifyResponse.json().catch(() => ({}));
        if (!verifyResponse.ok || !verifyData.success) {
          throw new Error(verifyData.message || 'تعذر التحقق من الرمز');
        }

        sessionStorage.setItem('otpVerified', 'true');

        formData.email = email;
        const completeResponse = await fetch('/api/otp/complete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            registrationToken: verifyData.registrationToken,
            formData
          })
        });
        const completeData = await completeResponse.json().catch(() => ({}));
        if (!completeResponse.ok || !completeData.success) {
          throw new Error(completeData.message || 'تم التحقق لكن تعذر حفظ الحساب');
        }

        showMessage('✓ تم التحقق وإنشاء الحساب بنجاح. سيتم تحويلك إلى تسجيل الدخول...', 'success');
        sessionStorage.removeItem('verifyFormData');
        sessionStorage.removeItem('pendingVerification');
        sessionStorage.removeItem('otpVerified');

        setTimeout(() => { location.href = '/login.html'; }, 1500);
      } catch (error) {
        showMessage(error.message || 'حدث خطأ غير متوقع', 'error');
        button.disabled = false;
        button.textContent = 'تحقق وأنشئ الحساب';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاستوديو - كرار كريم</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
  <div class="dashboard-app">

    <main class="dashboard-content">
      <section class="welcome-section">
        <span class="welcome-label">الاستوديو</span>
        <h1>الاستوديو</h1>
      </section>

      <section class="studio-publisher">
        <button type="button" class="create-post-button" id="createPostButton">
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
          <span>إنشاء منشور</span>
        </button>
      </section>
    </main>

  </div>

  <div class="post-modal" id="postModal" aria-hidden="true">
    <div class="post-modal-overlay" id="postModalOverlay"></div>

    <div class="post-modal-card" role="dialog" aria-modal="true" aria-labelledby="postModalTitle">
      <div class="post-modal-header">
        <h2 id="postModalTitle">إنشاء منشور</h2>

        <button type="button" class="post-modal-close" id="postModalClose" aria-label="إغلاق">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>

      <div class="post-modal-body">
        <label class="post-field-label" for="postSection">القسم</label>
        <select id="postSection" class="post-input">
          <option value="studio">الاستوديو</option>
          <option value="poetry">قصائد شعرية</option>
          <option value="theatre">مسرحي</option>
          <option value="events">المناسبات</option>
          <option value="festivals">المهرجانات</option>
          <option value="articles">المقالات</option>
        </select>

        <label class="post-field-label" for="postSubsection">القسم الفرعي</label>
        <select id="postSubsection" class="post-input">
          <option value="">اختر القسم الفرعي</option>
        </select>

        <label class="post-field-label" for="postContent">وصف المنشور</label>

        <div class="post-content-media-box">
          <textarea
            id="postContent"
            class="post-textarea"
            maxlength="5000"
            placeholder="اكتب وصفاً واضحاً للمنشور..."
          ></textarea>

          <div class="post-media-actions">
            <label class="post-media-button">
              <i class="fa-solid fa-photo-film" aria-hidden="true"></i>
              <span>إضافة صور أو فيديوهات</span>
              <input
                type="file"
                id="postMedia"
                accept="image/*,video/*"
                multiple
                hidden
              >
            </label>
          </div>

          <div class="post-selected-file" id="postSelectedFile"></div>
        </div>

        <button type="button" class="publish-post-button" id="publishPostButton">
          <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
          <span>نشر المنشور</span>
        </button>
      </div>
    </div>
  </div>

  <div class="media-viewer" id="mediaViewer" aria-hidden="true">
    <div class="media-viewer-overlay" id="mediaViewerOverlay"></div>

    <div class="media-viewer-content" role="dialog" aria-modal="true" aria-label="عرض الوسائط">
      <button
        type="button"
        class="media-viewer-close"
        id="mediaViewerClose"
        aria-label="إغلاق"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="media-viewer-prev"
        id="mediaViewerPrev"
        aria-label="الوسائط السابقة"
      >
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>

      <div class="media-viewer-stage" id="mediaViewerStage"></div>

      <button
        type="button"
        class="media-viewer-next"
        id="mediaViewerNext"
        aria-label="الوسائط التالية"
      >
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <script>
    const createPostButton = document.getElementById('createPostButton');
    const postModal = document.getElementById('postModal');
    const postModalClose = document.getElementById('postModalClose');
    const postModalOverlay = document.getElementById('postModalOverlay');
    const postMedia = document.getElementById('postMedia');
    const postSelectedFile = document.getElementById('postSelectedFile');
    const MAX_MEDIA_FILES = 10;
    let selectedMediaFiles = [];
    const postSection = document.getElementById('postSection');
    const postSubsection = document.getElementById('postSubsection');

    const mediaViewer = document.getElementById('mediaViewer');
    const mediaViewerOverlay = document.getElementById('mediaViewerOverlay');
    const mediaViewerClose = document.getElementById('mediaViewerClose');
    const mediaViewerPrev = document.getElementById('mediaViewerPrev');
    const mediaViewerNext = document.getElementById('mediaViewerNext');
    const mediaViewerStage = document.getElementById('mediaViewerStage');

    let mediaViewerIndex = 0;

    function renderMediaViewer() {
      if (!selectedMediaFiles.length) {
        return;
      }

      const file = selectedMediaFiles[mediaViewerIndex];

      if (!file) {
        return;
      }

      mediaViewerStage.innerHTML = '';

      const fileUrl = URL.createObjectURL(file);

      if (file.type.startsWith('image/')) {
        const image = document.createElement('img');
        image.src = fileUrl;
        image.alt = 'عرض الصورة';
        mediaViewerStage.appendChild(image);
      } else if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = fileUrl;
        video.controls = true;
        video.autoplay = true;
        video.preload = 'metadata';
        mediaViewerStage.appendChild(video);
      }

      mediaViewer.classList.add('open');
      mediaViewer.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeMediaViewer() {
      mediaViewer.classList.remove('open');
      mediaViewer.setAttribute('aria-hidden', 'true');
      mediaViewerStage.innerHTML = '';
      document.body.style.overflow = '';
    }

    function deleteCurrentMedia() {
      if (!selectedMediaFiles.length) {
        return;
      }

      const deletedFile = selectedMediaFiles[mediaViewerIndex];

      if (!deletedFile) {
        return;
      }

      selectedMediaFiles.splice(mediaViewerIndex, 1);

      const dataTransfer = new DataTransfer();

      selectedMediaFiles.forEach((file) => {
        dataTransfer.items.add(file);
      });

      postMedia.files = dataTransfer.files;

      if (!selectedMediaFiles.length) {
        closeMediaViewer();
        showSelectedFiles(postMedia);
        return;
      }

      if (mediaViewerIndex >= selectedMediaFiles.length) {
        mediaViewerIndex = selectedMediaFiles.length - 1;
      }

      showSelectedFiles(postMedia);
      renderMediaViewer();
    }

    function showPreviousMedia() {
      if (selectedMediaFiles.length <= 1) {
        return;
      }

      mediaViewerIndex =
        (mediaViewerIndex - 1 + selectedMediaFiles.length) %
        selectedMediaFiles.length;

      renderMediaViewer();
    }

    function showNextMedia() {
      if (selectedMediaFiles.length <= 1) {
        return;
      }

      mediaViewerIndex =
        (mediaViewerIndex + 1) %
        selectedMediaFiles.length;

      renderMediaViewer();
    }

    mediaViewerClose.addEventListener('click', closeMediaViewer);
    mediaViewerOverlay.addEventListener('click', closeMediaViewer);
    mediaViewerPrev.addEventListener('click', showPreviousMedia);
    mediaViewerNext.addEventListener('click', showNextMedia);

    document.addEventListener('keydown', (event) => {
      if (!mediaViewer.classList.contains('open')) {
        return;
      }

      if (event.key === 'Escape') {
        closeMediaViewer();
      }

      if (event.key === 'ArrowRight') {
        showPreviousMedia();
      }

      if (event.key === 'ArrowLeft') {
        showNextMedia();
      }
    });

    const sectionSubsections = {
      studio: [
        ['general', 'أعمال الاستوديو']
      ],
      poetry: [
        ['poems', 'قصائد شعرية']
      ],
      theatre: [
        ['plays', 'مسرحيات']
      ],
      events: [
        ['general', 'فعاليات ومناسبات']
      ],
      festivals: [
        ['general', 'مهرجانات']
      ],
      articles: [
        ['general', 'مقالات']
      ]
    };

    function updateSubsections() {
      const sections = sectionSubsections[postSection.value] || [];

      postSubsection.innerHTML = '<option value="">اختر القسم الفرعي</option>';

      sections.forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        postSubsection.appendChild(option);
      });
    }

    postSection.addEventListener('change', updateSubsections);
    updateSubsections();

    function openPostModal() {
      postModal.classList.add('open');
      postModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closePostModal() {
      postModal.classList.remove('open');
      postModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function showSelectedFiles(input) {
      selectedMediaFiles = Array.from(input.files);

      if (!selectedMediaFiles.length) {
        postSelectedFile.innerHTML = '';
        postSelectedFile.dataset.count = '0';
        return;
      }

      const selectedFiles = selectedMediaFiles;

      if (selectedFiles.length > MAX_MEDIA_FILES) {
        alert(`الحد الأقصى المسموح به هو ${MAX_MEDIA_FILES} ملفات فقط.`);
        input.value = '';
        selectedMediaFiles = [];
        postSelectedFile.innerHTML = '';
        postSelectedFile.dataset.count = '0';
        return;
      }

      postSelectedFile.innerHTML = '';
      postSelectedFile.dataset.count = selectedFiles.length;

      const visibleCount = selectedFiles.length > 5 ? 5 : selectedFiles.length;
      const visibleFiles = selectedFiles.slice(0, visibleCount);
      const extraCount = selectedFiles.length - visibleCount;

      visibleFiles.forEach((file, index) => {
        const fileUrl = URL.createObjectURL(file);

        const mediaItem = document.createElement('div');
        mediaItem.className = 'post-media-item';

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'post-media-remove';
        removeButton.setAttribute('aria-label', 'حذف الوسائط');
        removeButton.innerHTML =
          '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';

        removeButton.addEventListener('click', () => {
          URL.revokeObjectURL(fileUrl);

          selectedMediaFiles = selectedMediaFiles.filter(
            (_, fileIndex) => fileIndex !== index
          );

          const dataTransfer = new DataTransfer();

          selectedMediaFiles.forEach((selectedFile) => {
            dataTransfer.items.add(selectedFile);
          });

          postMedia.files = dataTransfer.files;

          showSelectedFiles(postMedia);
        });

        mediaItem.appendChild(removeButton);

        mediaItem.style.cursor = 'pointer';

        mediaItem.addEventListener('click', (event) => {
          if (event.target.closest('.post-media-remove')) {
            return;
          }

          mediaViewerIndex = index;
          renderMediaViewer();
        });

        if (file.type.startsWith('image/')) {
          const preview = document.createElement('img');
          preview.src = fileUrl;
          preview.alt = `معاينة الصورة ${index + 1}`;
          preview.className = 'post-media-preview';
          mediaItem.appendChild(preview);
        } else if (file.type.startsWith('video/')) {
          const preview = document.createElement('video');
          preview.src = fileUrl;
          preview.className = 'post-media-preview';
          preview.controls = true;
          preview.preload = 'metadata';
          mediaItem.appendChild(preview);
        }

        if (index === visibleFiles.length - 1 && extraCount > 0) {
          const overlay = document.createElement('div');
          overlay.className = 'post-media-more';
          overlay.textContent = `+${extraCount}`;
          mediaItem.appendChild(overlay);
        }

        postSelectedFile.appendChild(mediaItem);
      });
    }

    createPostButton.addEventListener('click', openPostModal);
    postModalClose.addEventListener('click', closePostModal);
    postModalOverlay.addEventListener('click', closePostModal);

    postMedia.addEventListener('change', () => {
      showSelectedFiles(postMedia);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closePostModal();
      }
    });
  </script>
</body>
</html>
